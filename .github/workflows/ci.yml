name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Upload installable plugin artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v7
        with:
          name: dailycalsync-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

  api-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        obsidian-version: [1.11.4, latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Compile against Obsidian API ${{ matrix.obsidian-version }}
        run: |
          npm install --no-save --ignore-scripts obsidian@${{ matrix.obsidian-version }}
          npm run build
