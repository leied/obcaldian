name: Release

on:
  push:
    tags:
      - "*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Build, test, and validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check

      - name: Package plugin files
        run: |
          mkdir obcaldian
          cp main.js manifest.json styles.css obcaldian
          zip -r obcaldian.zip obcaldian

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            obcaldian.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --draft \
            main.js manifest.json styles.css obcaldian.zip
