name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release; the tag is created if needed (for example, 0.1.1)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          TAG="${DISPATCH_TAG:-$PUSH_TAG}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use x.y.z semantic-version format; received: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          # A manual run starts from the branch selected in GitHub's Run workflow UI.
          # Tag-triggered and reusable runs already have a tag created by their caller.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Select existing tag or prepare a new one
        id: source
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            git checkout --detach "refs/tags/$TAG"
            echo "create-tag=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "create-tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "Expected release tag $TAG to exist, but it was not found." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Build, test, and validate release metadata
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm run check

      - name: Create release tag
        if: steps.source.outputs.create-tag == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Package plugin files
        run: |
          mkdir -p dist/dailycalsync
          cp main.js manifest.json styles.css dist/dailycalsync/
          cd dist
          zip -r dailycalsync.zip dailycalsync

      - name: Upload installable workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: dailycalsync-${{ steps.release.outputs.tag }}
          path: dist/dailycalsync.zip
          if-no-files-found: error

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
            dist/dailycalsync.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber \
              main.js manifest.json styles.css dist/dailycalsync.zip
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "DailyCalSync $TAG" \
              --generate-notes \
              main.js manifest.json styles.css dist/dailycalsync.zip
          fi
